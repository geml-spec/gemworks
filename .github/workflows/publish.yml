name: Publish

# Manual trigger from the GitHub UI (Actions → "Publish" → Run workflow), the same shape as geml's "Publish to npm".
# Publishing is a deliberate act, not a side effect of a push: bump the version on main first
# (`node scripts/bump.mjs <version>`), let CI pass on all three systems, then run this.
#
# One build goes out twice:
# - to npm, under the three names scripts/publish.mjs publishes by hand: `gemworks`; `gemwork`, so that a name typed
#   without its last letter installs ours; and `gwx`, the short command's name. The gemworks marketplace
#   (.claude-plugin/marketplace.json) installs the plugin from the `gemworks` package.
# - to the `plugin` branch: the files of that same `gemworks` package, committed, for Anthropic's plugin directory. The
#   directory reads a plugin from a GitHub branch and people get only that folder, so it cannot follow main, where
#   dist/ is built and gitignored.
#
# One-time setup: add an npm **automation** token as the repo secret NPM_TOKEN (npmjs.com → Access Tokens → Generate →
# Automation) with publish rights on the three names. Nothing else is stored in the repo.
#
# Three jobs, so the token never shares a runner with an install script. `build` installs, tests and packs with nothing
# to steal; `npm` installs nothing and runs no script, it hands npm the tarballs `build` packed (a tarball's lifecycle
# scripts do not run on publish); `branch` commits the unpacked `gemworks` tarball and holds no npm token.
on:
  workflow_dispatch:
    inputs:
      npm:
        description: "Publish to npm. Off: only update the plugin branch, e.g. to validate it in the directory portal first."
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22" # engines.node >= 22

      - name: Install dependencies
        run: npm ci

      # Pre-publish gate: never ship a tree that does not build or pass. `npm test` builds first, so it also makes the
      # gitignored dist/ that the package's files[] ship.
      - name: Build + test
        run: npm test

      # The same build under each name. `gemworks` packs package.json as committed; the other two change only its
      # name (`npm pkg set` also reflows the file, so git puts it back rather than a second `npm pkg set`).
      - name: Pack
        id: pack
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP/pack"
          for name in gemwork gwx; do
            npm pkg set name="$name"
            npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP/pack"
          done
          git checkout -- package.json
          ls -l "$RUNNER_TEMP/pack"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/pack/*.tgz
          retention-days: 7

  npm:
    name: Publish to npm
    needs: build
    if: ${{ inputs.npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm provenance attests with (--provenance)
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # Writes an .npmrc that reads NODE_AUTH_TOKEN for the publish step below.
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: pack

      # `--provenance` attaches a signed link from each tarball back to this repo, commit and workflow run. A name
      # already at this version is skipped, so a run that stopped halfway can be run again to finish.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for name in gemworks gemwork gwx; do
            # A version a name does not have prints nothing, and some npm releases still exit 0: the output is what counts.
            if [ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ]; then
              echo "$name@$VERSION is already on npm"
              continue
            fi
            npm publish "./pack/$name-$VERSION.tgz" --provenance --access public
          done

  branch:
    name: Update the plugin branch
    needs: [build, npm]
    # After npm, so the directory never lists a version npm refused; on its own when the run skips npm.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/pack

      # The branch holds exactly the package: every tracked file goes, the tarball's files come in. Its history is
      # one commit per published version.
      - name: Commit the package to the plugin branch
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if git ls-remote --exit-code --heads origin plugin >/dev/null; then
            git switch -c plugin --track origin/plugin
          else
            git switch --orphan plugin
          fi
          git rm -rq --ignore-unmatch .
          git clean -fdxq
          tar -xzf "$RUNNER_TEMP/pack/gemworks-$VERSION.tgz" --strip-components=1
          git add -A
          if git diff --cached --quiet; then
            echo "the plugin branch already holds gemworks $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "gemworks $VERSION" -m "The files of the gemworks@$VERSION npm package, from $GITHUB_SHA."
          git push origin plugin
